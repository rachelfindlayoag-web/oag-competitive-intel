<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OAG Competitive Intelligence Hub — Sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #111310;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1d18;
      border: 1px solid #2a2d28;
      border-top: 3px solid #FFD602;
      padding: 40px 48px;
      width: 100%;
      max-width: 420px;
    }
    .logo {
      font-size: 22px;
      font-weight: 300;
      color: #fff;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    .logo span { color: #FFD602; font-weight: 700; }
    .subtitle {
      font-size: 11px;
      color: #888;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 36px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #aaa;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    input[type="password"] {
      width: 100%;
      background: #111310;
      border: 1px solid #333;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="password"]:focus { border-color: #FFD602; }
    button {
      margin-top: 16px;
      width: 100%;
      background: #FFD602;
      color: #111310;
      border: none;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 13px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    .error {
      margin-top: 14px;
      background: #3d1a1a;
      border-left: 3px solid #c0392b;
      padding: 10px 12px;
      font-size: 12px;
      color: #e88;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 10px;
      color: #444;
      text-align: center;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><span>OAG</span></div>
    <div class="subtitle">Competitive Intelligence Hub</div>

    <form method="POST" action="/login">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" autofocus autocomplete="current-password"/>
      <button type="submit">Sign in</button>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
    </form>
  </div>
  <div class="footer-note">Internal use only &nbsp;·&nbsp; OAG Aviation Worldwide</div>
</body>
</html>
